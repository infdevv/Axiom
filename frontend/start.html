<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="styles/start.css" />
</head>
<body name="primary">

  <div class="container">
    <div class="main-content">

      <div class="greeting-section">
        <h2 id="greetingText">Good morning</h2>
        <p id="welcomeMessage">Welcome back to Axiom</p>
      </div>

      <div class="time-section">
        <p id="currentTime">12:00</p>
        <p id="currentDate">Monday, January 1</p>
      </div>

      <div class="search-section">
        <div class="search-container" name="secondary">
          <span class="material-symbols-outlined search-icon">search</span>
          <input type="text" placeholder="Search the web or enter URL" id="urlBar" autocomplete="off" autofocus />
        </div>
      </div>

      <div class="shortcuts-section">
        <div id="quickItems">
          <div class="quickItem" onclick="window.location='apps.html'">
            <div class="icon-container" name="tertiary">
              <span class="material-symbols-outlined">stadia_controller</span>
            </div>
            <span name="textSecondary">Games</span>
          </div>
          <div class="quickItem" onclick="window.location='settings.html'">
            <div class="icon-container" name="tertiary">
              <span class="material-symbols-outlined">settings</span>
            </div>
            <span name="textSecondary">Settings</span>
          </div>
          <div class="quickItem" onclick="window.location='/features/bot.html'">
            <div class="icon-container" name="tertiary">
              <span class="material-symbols-outlined">deployed_code</span>
            </div>
            <span name="textSecondary">ChatGPT</span>
          </div>
        </div>
      </div>

    </div>
  </div>
  <script src="scripts/global.js" type="module"></script>
  <script src="scripts/start.js"></script>
</body>
</html>
