<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Not Found</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    color: white;
    font-family: Arial, sans-serif;
  }

  body {
    background-color: #0d0d0d;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  h1 {
    font-size: 6rem;
    margin-bottom: 1rem;
  }

  p {
    font-size: 1.25rem;
    margin-bottom: 2rem;
    opacity: 0.8;
  }

  a {
    color: #00bfff;
    text-decoration: none;
    font-weight: bold;
    border: 1px solid #00bfff;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    transition: background 0.3s;
  }

  a:hover {
    background-color: #00bfff;
    color: #0d0d0d;
  }

  footer {
    position: absolute;
    bottom: 10px;
    font-size: 0.8rem;
    opacity: 0.5;
  }

  img {
    display: none;
  }
</style>

<script>
        document.addEventListener("keydown", function(event) {
  if (event.key === "c" || event.key === "g") { // keep original functionality
    window.open('about:blank').document.write(
      '<iframe src="../main.html" style="border:0; position:fixed; top:0; left:0; width:100%; height:100%;"></iframe>'
    );
  }
  if (event.key == "x") { // keep original functionality
    window.location = "../main.html";
  }
});
</script>
</head>

<body>
  <h1>404</h1>
  <p>Oops! The page you’re looking for doesn’t exist.</p>
  <a href="/">Go Home</a>

  <footer>
    &copy; 2025 Axiom. Press "C". All rights reserved.
  </footer>


</body>
</html>
