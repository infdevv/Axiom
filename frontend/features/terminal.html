<!DOCTYPE html>
<html>
	<head>
		<title>Axiom Terminal</title>
		<style>
			body
{
    background-color: black;
    font-family: monospace;
}

#log {
    user-select: none;
}</style>

	</head>
	<body name="primary">

		<div id="log" name="secondary">
		</div>
		<script>
			let command = ""
function write(key) {
    document.getElementById("log").innerHTML += key;
}

console.log = function(data){
    write(data)
}

console.warn = function(data){
    write("[WARN]: " + data)
}

console.error = function(data){
    write("[error]: " + data)
}

write(`
Axiom Terminal V2
<br>
Use JavaScript here!
<br>
>
`)

document.addEventListener("keydown", function(event) {
    const log = document.getElementById("log");

    if (event.key === "Enter") {
        write("<br>");
        eval(command)
        command=""
                write("<br>");
        write("> ")
    } else if (event.key === "Backspace") {
        log.innerHTML = log.innerHTML.slice(0, -1);
        command.slice(0,-1)
    } else {
        if (event.key.length === 1) {
            write(event.key);
            command+=event.key
        }
    }
});</script>
	</body>
</html>
