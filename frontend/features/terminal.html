<!DOCTYPE html>
<html>
<head>
    <title>Axiom Terminal</title>
    <style>
        body {
            background-color: black;
            background-size: cover;
            background-repeat: no-repeat;
            color: lime;
            font-family: monospace;
            padding: 10px;
            overflow: hidden;
        }

        #log {
            user-select: none;
            white-space: pre-wrap;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px) saturate(150%) brightness(0.9);
            -webkit-backdrop-filter: blur(15px) saturate(150%) brightness(0.9);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.2);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(0, 255, 0, 0.05) inset;
            min-height: calc(100vh - 40px);
        }
    </style>
</head>
<body name="primary">
    <div id="log" name="secondary"></div>
    <script>
        let command = "";

        function write(text) {
            document.getElementById("log").innerHTML += text;
            window.scrollTo(0, document.body.scrollHeight);
        }

        console.log = function(data) {
            write(data + "<br>");
        };

        console.warn = function(data) {
            write("[WARN]: " + data + "<br>");
        };

        console.error = function(data) {
            write("[ERROR]: " + data + "<br>");
        };

        write(`Axiom Terminal V2<br>Use JavaScript here!<br>> `);

        document.addEventListener("keydown", function(event) {
            const log = document.getElementById("log");

            if (event.key === "Enter") {
                event.preventDefault();
                write("<br>");
                try {
                    const result = eval(command);
                    if (result !== undefined) console.log(result);
                } catch (err) {
                    console.error(err);
                }
                command = "";
                write("> ");
            } else if (event.key === "Backspace") {
                event.preventDefault();
                if (command.length > 0) {
                    command = command.slice(0, -1);
                    log.innerHTML = log.innerHTML.slice(0, -1);
                }
            } else if (event.key.length === 1) {
                write(event.key);
                command += event.key;
            }
        });
    </script>
    <script src="../scripts/global.js" type="module"></script>
</body>
</html>
