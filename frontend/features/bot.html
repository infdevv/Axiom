<!-- Life of the Party -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axiom | Bots</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    body {
      margin: 0;
      color: white;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-size: cover;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    .message {
      padding: 10px;
      margin: 10px;
      border-radius: 10px;
      text-align: left;
      width: fit-content;
      margin-left: auto;
      background: rgba(42, 42, 42, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .message.bot {
      text-align: left;
      margin-left: 0px;
      margin-right: auto;
      background: rgba(255, 255, 255, 0.1);
    }

    .container {
      overflow-y: auto;
      height: 90vh;
      width: 60%;
    }

    .container::-webkit-scrollbar {
      display: none;
    }

    #chat-input {
      padding: 8px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 14px;
      position: fixed;
      bottom: 10px;
      width: 60%;
      left: calc(50% - 30%);
      background: rgba(42, 42, 42, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: white;
      outline: none;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    #chat-input:focus {
      background: rgba(42, 42, 42, 0.4);
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body name="primary">
  <center>
    <div class="container">

      <div class="message bot">
        Ask anything!
      </div>


    </div>
  </center>
  <input type="text" id="chat-input" autocomplete="off" placeholder="Type a message..." />


  <script src="../scripts/global.js" type="module"></script>
  <script>
    const isPremium = sessionStorage.getItem("premium")
    let content = sessionStorage.getItem("content")
    if (isPremium == "false") {
      content = "No content provided. If the user asks why, tell them to get Axiom Premium."
    }
    let chat = [
      {
        "content": 
        `You are the Axiom assistant, an assistant from the Axiom Network, a group dedicated to providing privacy tools. You will not bring this up unless explicitly mentioned. You may help the user complete things such as homework and other tasks. Just solve it for them vro.
        Use this site infomation to assist in your responses: ${content}
        Only use it if explicitly asked for the site to be used. The site is the page the user is currently on.
        `,
        "role": "system"
      }
    ]
    let currentPageText = null;
    setInterval(function () {
      let pageHTML = sessionStorage.getItem("pageCode")

      pageHTML = pageHTML.replaceAll(/<script\b[^>]*>[\s\S]*?<\/script>/gi, "").replaceAll(/<[^>]*>/g, "")


      currentPageText = pageHTML // cleaned up

    },500)

    function generateResponse(chat) {

      fetch("/api/ai", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: chat
        })
      }).then(res => res.text()).then(text => {
        // we get a raw text response back
        const message = document.createElement("div");
        message.classList.add("message");
        message.classList.add("bot");
        message.textContent = text;
        document.querySelector(".container").appendChild(message);
        chat.push({ "content": text, "role": "assistant" });
      })

    }

    document.getElementById("chat-input").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        const message = document.createElement("div");
        message.classList.add("message");
        const userMessage = document.getElementById("chat-input").value;
        message.textContent = userMessage;
        document.querySelector(".container").appendChild(message);
        document.getElementById("chat-input").value = "";
        chat.push({ "content": userMessage, "role": "user" })
        generateResponse(chat)
      }
    })
  </script>
</body>

</html>
