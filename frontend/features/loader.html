<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/global.js" defer></script>
    <script src="js/themeManager.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: transparent;
            color: var(--theme-textPrimary, #ffffff);
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            position: relative;
        }

        #land {
            width: 80%;
            max-width: 600px;
            text-align: center;
            padding: 2rem;
            background: rgba(32, 32, 32, 0.5);
            backdrop-filter: blur(15px) saturate(150%) brightness(0.9);
            -webkit-backdrop-filter: blur(15px) saturate(150%) brightness(0.9);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 1px 2px rgba(255, 255, 255, 0.1) inset;
            transition: all 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #land h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin: 0 0 1rem 0;
            color: var(--theme-textPrimary, #ffffff);
            transition: color 0.3s ease;
        }

        #land h2 {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 400;
            margin: 1rem 0 2rem 0;
            color: var(--theme-textSecondary, #b0b0b0);
            line-height: 1.6;
            transition: color 0.3s ease;
        }

        .hero-feature {
            color: var(--theme-accent, #4fc3f7);
            font-weight: 600;
            margin: 0 5px;
            animation: pulse 2s ease-in-out infinite;
            transition: color 0.3s ease;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid var(--theme-surface, rgba(255, 255, 255, 0.1));
            border-top: 4px solid var(--theme-accent, #4fc3f7);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            margin-top: 1rem;
            transition: border-color 0.3s ease;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .progress-container {
            width: 100%;
            height: 3px;
            background: var(--theme-surface, rgba(255, 255, 255, 0.1));
            border-radius: 10px;
            margin-top: 2rem;
            margin-left: auto;
            margin-right: auto;
            overflow: hidden;
            position: relative;
            transition: background-color 0.3s ease;
        }

        .progress-bar {
            height: 100%;
            background: var(--theme-accent, #4fc3f7);
            border-radius: 10px;
            animation: progressFlow 3s ease-in-out infinite;
            transition: background-color 0.3s ease;
        }

        @keyframes progressFlow {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
    </style>

</head>

<body>


<img id="funny" style="position: fixed; bottom: 20px; left: 20px; z-index: 9999; border: none;">



    <div id="land">

            <center>
                <h1>Loading site</h1>

                <br>

                <!--
                <span class="loader"></span>
            -->
                <div class="progress-container">
                    <div class="progress-bar"></div>
                </div>

            </center>

   


    <script>

        if (localStorage.getItem("axiomTheme") == "klumi1.5"){
            document.getElementById("funny").style.width = "250px";
            document.getElementById("funny").src = "./assets/sakuya.gif"
        }
        if (localStorage.getItem("axiomTheme") == "pipper"){
            document.body.style.backgroundColor = "#fcb4ff";
            document.getElementById("funny").src = "./assets/spinning-zako.gif"
        }

    </script>
</body>

</html>
