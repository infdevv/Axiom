<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom Settings</title>
    <link rel="stylesheet" href="styles/settings.css">
</head>
<body name="primary">

    <!-- No, I won't stop using <center> I don't care if its deprecated -->
    <center name="secondary">

        <h2>Settings</h2>

        <br>

        <div class="setting" name="secondary">
            <h4>Pick Theme</h4>
        </div>

        <div class="setting" name="secondary">
            <button name="tertiary" style="padding: 8px; border-radius: 8px;" onclick="localStorage.clear()">Reset Everything</button>
        </div>

        <div class="setting" name="secondary">
            <h4>Premium Key (Get in the Discord)</h4>
        </div>

        <div style="display: flex;">
            <p id="status">Unregistered</p>
            <br>
            <input type="text" id="premiumKey" name="tertiary" value="Put your key here!">
            <button name="tertiary" style="padding: 8px; border-radius: 8px;" onclick="setPremiumKey(document.getElementById('premiumKey').value)">Set</button>
        </div>

        <a href="/goats.html">Visit hall of G.O.A.TS ( lebron isn't one of them )</a>

    </center>

    <script src="scripts/settings.js"></script>
    <script src="scripts/global.js" type="module"></script>
</body>
</html>
