<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Axiom Launch</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="scripts/css/global.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="/scram_es/scramjet.config.js"></script>
    <script src="/scram/scramjet.all.js"></script>
    <script src="/baremux/index.js" defer></script>
    <script src="/epoxy/index.js" defer></script>
    <link rel="stylesheet" href="styles/render.css">
</head>
<body>
    <div id="searchbar">
        <span class="material-symbols-outlined" onclick="history.back()">arrow_back</span>
        <span class="material-symbols-outlined" onclick="history.forward()">arrow_forward</span>
        <span id="refresh" onclick="location.reload()" class="material-symbols-outlined">refresh</span>
        <input id="search" oninput="search()" placeholder="Search or enter URL..." type="search" />
        <span onclick="navigateToPage()" class="material-symbols-outlined">search</span>
        <span onclick="handle_eruda()" class="material-symbols-outlined">terminal</span>
        <span onclick="handle_fullscreen()" class="material-symbols-outlined">fullscreen</span>
    </div>

    <div id="frames">
        <div id="frame-container"></div>
    </div>

    <script src="browser/scripts/themes.js"></script>
    <script src="browser/scripts/premium.js"></script>
    <script src="scripts/render.js"></script>

</body>

</html>
