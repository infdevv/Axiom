<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>New Tab</title>
    <link rel="stylesheet" href="styles/start.css">
</head>

<body>
    <h3>Axiom</h3>
    <div class="search-container">
        <input class="search-input" placeholder="Search or enter URL" type="text" id="search">
        <i class="material-symbols-outlined  search-icon">search</i>
    </div>
    <div id="shortcuts">
        <div class="shortcut" onclick="window.location='./gapps.html'">
            <i class="material-symbols-outlined">gamepad</i>
            <span>Games</span>
        </div>
        <div class="shortcut" onclick="window.location='./apps.html'">
            <i class="material-symbols-outlined">menu</i>
            <span>Apps</span>
        </div>

        <div class="shortcut" onclick="window.location='./ai.html'">
            <i class="material-symbols-outlined">article</i>
            <span>AI Chat</span>
        </div>

        <div class="shortcut" onclick="window.location='./settings.html'">
            <i class="material-symbols-outlined">settings</i>
            <span>Settings</span>
        </div>


    </div>

    <script src="scripts/themes.js"></script>
    <script>
        document.getElementById("search").addEventListener("keydown", function (event) {
            if (event.key == "Enter") {
                window.location = "../render.html?url=" + btoa(document.getElementById("search").value);
            }
        });
    </script>
</body>

</html>
