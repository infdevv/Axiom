<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom</title>
    <style>
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            position: absolute; 
            top: 0;
            left: 0;
        }
    </style> 
    <script src="/eta/bundle.js" defer></script>
    <script src="/eta/config.js" defer></script>
    <script src="/baremux/index.js" defer></script>
    <script src="/epoxy/index.js" defer></script>
</head>

<body>
    <iframe id="frame" src="browser/load.html"></iframe>

    <script>
        window.addEventListener('load', async () => {
         loadOxygen();
        })

        function search(input, searchEngine = "") {
            if (searchEngine == "") searchEngine = localStorage.getItem("search") || "https://search.brave.com/search?q=";
            try {
                new URL(input);
                return input;
            } catch {
                return searchEngine + encodeURIComponent(input);
            }
        }

        function getUrl() {
            const params = new URLSearchParams(window.location.search);
            const encoded = params.get("url");
            return encoded ? atob(encoded) : "https://www.guthib.com"; // yea
        }

        setInterval(() => {
            try {
                let frameDoc = document.getElementById("frame").contentDocument;
                if (!frameDoc) return;

                let title = frameDoc.title;
                let frameUrl = "";

                // Try to get the current URL from the iframe
                try {
                    frameUrl = frameDoc.location.href;
                    // Decode Ultraviolet URL if it's encoded
                    if (frameUrl && typeof __uv$config !== 'undefined' && __uv$config.decodeUrl) {
                        frameUrl = __uv$config.decodeUrl(frameUrl);
                    }
                } catch (e) {
                    // If we can't access the URL, use the original URL
                    frameUrl = getUrl();
                }

                // Format title as: (page title)|A|(actual url)
                let formattedTitle = title + "|A|" + frameUrl;
                if (formattedTitle !== document.title) {
                    document.title = formattedTitle;
                }

                // get content
                let content = frameDoc.body.innerHTML;
                // remove html tags
                content = content.replace(/<[^>]+>/g, '');
                content = content.replace(/&nbsp;/g, ' ');
                // remove tabs
                content = content.replace(/\t/g, ' ');
                content = content.replace(/\n/g, ' ');
                // remove one word lines
                content = content.replace(/\n\s*\n/g, '\n');
                // remove leading and trailing spaces
                content = content.trim();
                localStorage.setItem("content", content);
            } catch (e) {
                // Cross-origin error handling
                console.debug('Could not access iframe content:', e);
            }
        }, 100);


        async function loadOxygen() {
            // uv-based
            // register sw

            const connection = new BareMux.BareMuxConnection("/baremux/worker.js");

            if ("serviceWorker" in navigator) {
                await navigator.serviceWorker.register("sw.js");
            }

            const url = search(getUrl());

            let frame = document.getElementById("frame");

            let wispUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/wisp/";
            await connection.setTransport("/epoxy/index.mjs", [{ wisp: wispUrl }]);

            frame.src = __uv$config.prefix + __uv$config.encodeUrl(url);
        }


    </script>
</body>

</html>
