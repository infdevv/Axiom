<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <style>
    #loader {
        z-index: 15;
        background-color: transparent;
        width: 100%;
        height: 100%;
        top: 0px;
        left: 0px;
        position: fixed;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "Inter", sans-serif;
    }
    
    .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    
    .loader-logo {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 30px;
        color: white;
        text-align: center;
    }
    
    .loader-logo span {
        color: #778DA9;
    }
    
    .loader-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top: 4px solid #778DA9;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }
    
    .loader-text {
        color: #ffffff;
        font-size: 16px;
        text-align: center;
        margin-top: 15px;
        opacity: 0.8;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    .loading-dots:after {
        content: '.';
        animation: dots 1.5s steps(5, end) infinite;
    }
    
    @keyframes dots {
        0%, 20% { content: '.'; }
        40% { content: '..'; }
        60%, 100% { content: '...'; }
    }
</style>
<body>
    <div id="loader">
        <div class="loader-container">
            <div class="loader-logo">Loading site<span class="loading-dots"></span></div>
            <div class="loader-spinner"></div>
        </div>
    </div>
</body>
