        <iframe style="z-index: -15;" src="./assets/extras/loader.html"></iframe>
        <script>
const stockSW = "./sw.js";

const swAllowedHostnames = ["localhost", "127.0.0.1"];

async function registerSW() {
	if (!navigator.serviceWorker) {
		if (
			location.protocol !== "https:" &&
			!swAllowedHostnames.includes(location.hostname)
		)
			throw new Error("Service workers cannot be registered without https.");

		throw new Error("Your browser doesn't support service workers.");
	}

	await navigator.serviceWorker.register(stockSW);
}

document.addEventListener('DOMContentLoaded', async function() {

 while (typeof BareMux === 'undefined') {
  await new Promise(resolve => setTimeout(resolve, 100));
 }
 
 const { ScramjetController } = $scramjetLoadController();

 const scramjet = new ScramjetController({
  files: {
   wasm: '/scram/scramjet.wasm.wasm',
   all: '/scram/scramjet.all.js',
   sync: '/scram/scramjet.sync.js',
  },
 });

 let url = ""
 const urlParams = new URLSearchParams(window.location.search);
 url = atob(urlParams.get("url")) || "";
 if (url.includes("exexex")){
	// get ip, its required for frogiee's bypass
	fetch("/api/ip").then(res => res.json()).then(res => {
		url = url.replace("exexex", (res.ip).split(".")[0]);
	});
 }
 const tabId = urlParams.get('tabId');

 scramjet.init();

 const connection = new BareMux.BareMuxConnection("/baremux/worker.js");

 try {
  await registerSW();
 } catch (err) {
  console.error("Failed to register service worker:", err);
 }

 await connection.setTransport("/epoxy/index.mjs", [{
  wisp: "wss://anura.pro/" //(location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/wisp/"
  // temp thing
 }]);
 
 const frame = scramjet.createFrame();
 frame.frame.id = "frame";
 document.body.appendChild(frame.frame);

 frame.go(url);
});</script>
