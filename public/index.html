<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom Network</title>
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/index.css">
    <style>
        .c {
            color: #43a7e0;
        }
    </style>
</head>
<body>
    <center id="welcome">
        <h3>Hey! It looks like this is the first time you are using this</h3>
        <br>
        <h3>Here's what to do when you visit, press the <span class="c">C</span> key on your keyboard!</h3>
        <h3>You'll be redirected to Axiom in <span id="time">10</span> seconds</h3>
    </center>

</body>
<script>
if (localStorage.getItem("axiomFirstvisit") == null) {
    localStorage.setItem("axiomFirstvisit", 1)
    
let timer = 0

setInterval(function(){
    timer += 1
    document.getElementById("time").innerText = 10 - timer
    if (timer == 10){
        window.location = "ck.html" // Yeah!
    }
},1000)

}
else {
    window.location = "ck.html" // Yeah!
}
</script>
