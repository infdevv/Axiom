@import url(https://fonts.googleapis.com/css?family=Inter:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic);

body {
    font-family: inter;
    background-color: transparent;
    display: flex;
    justify-content: center; 
    align-items: center;
    min-height: 100vh;
    margin: 0; 
}

* {
    color: var(--text-color);
}

.logo {
    margin-bottom: 0;
    padding-bottom: 0;
}

#time {
    margin-top: 0;
    padding-top: 0;
}

.main_button{
    padding: 14px;
    border: none;
    box-shadow: 1px 1px 1px 1px rgba(7,7,7,0.2);
    border-radius: 4px;
    background-color: var(--theme-tertiary);
    cursor: pointer;
}

.main_button_type2 {
    padding: 14px;
    border-style: solid;
    border-width: 3px;
    border-color: var(--theme-tertiary);
    border-radius: 4px;
    background-color: transparent;
    cursor: pointer;
}

.logo {
    font-size: 60px;
    padding: 0px;
}

.search-bar {
    position: relative;
    width: 400px;
    margin: 0 auto;
}

.search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: var(--text-color);
    pointer-events: none;
    z-index: 1;
}

input {
    width: 100%;
    background-color: rgba(var(--theme-tertiary-rgb), 0.6);
    padding: 14px 14px 14px 0;
    border: 2px solid var(--theme-quaternary);
    border-radius: 25px;
    transition: all 0.3s ease;
    animation: shrink .3s;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: var(--theme-secondary);
    background-color: rgba(var(--theme-tertiary-rgb), 0.9);
    box-shadow: 0 0 10px rgba(var(--theme-secondary-rgb), 0.5);
}

.shortcuts {
    display: flex;
    width: 100%;
    justify-content: center;
    margin-top: 15px;
    gap: 9px;
}

.shortcut {
    display: block;
    border-style: solid;
    border-width: 3px;
    border-radius: 7px;
    width: min-content;
    border-color: var(--theme-border);
    width: 60px;
    height: min-content;
    justify-content: center;
    align-items: center;
}

.shortcut:hover {
    transform: scale(1.05);
    background-color: rgba(var(--theme-tertiary-rgb), 0.2);
    backdrop-filter: blur(5px);
    transition: transform 0.1s ease-in-out;
}

.shortcut {
    display: block;
    border-style: solid;
    border-width: 3px;
    border-radius: 7px;
    width: min-content;
    border-color: var(--theme-border);
    padding: 12px;
    width: 60px;
    height: 50px;
    justify-content: center;
    align-items: center;
    transition: transform 0.3s ease-in-out;
}
center {
    position: absolute;
    top: 40%; /* Positioned 40% from the top */
    left: 50%; /* Positioned 50% from the left */
    transform: translate(-50%, -50%); /* Shifted back by half its own width/height */
    text-align: center;
}
    </style>
</head>

    <script src="./scripts/themeManager.js"></script>
    <script>
        themeManager.load().then(() => {
            console.log('Theme loaded in start.html');
        }).catch(console.error);

        function updateTime(){
            let date = new Date().getHours()
            let minutes = new Date().getMinutes()
            let ampm = date >= 12 ? " PM" : " AM"
            let beautifulMorning = date >= 12 ? " evening" : " morning"
            date = date % 12 || 12

            minutes = minutes.toString().padStart(2, '0')

            date = "Good " + beautifulMorning + ". It currently is " + (date < 12 ? date + ":" + minutes + ampm : 12  + ":" + minutes + ampm)

            document.getElementById("time").innerText = date
        }
        setInterval(function(){
 updateTime()
        }, 1000 * 60)
        updateTime()
    </script>
