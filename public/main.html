<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom Browser</title>
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

</head>

<body>

    <div id="tabs">
        <span class="new-tab-btn" onclick="axiom.createTab()">
            <span class="material-symbols-outlined">add</span>
        </span>
    </div>

    <div id="controls">
        <div id="controls-buttons">
            <span class="material-symbols-outlined" onclick="axiom.nav('back')">arrow_back</span>
            <span class="material-symbols-outlined" onclick="axiom.nav('forward')">arrow_forward</span>
            <span class="material-symbols-outlined" onclick="axiom.nav('reload')">refresh</span>
        </div>

        <div id="search-section">
            <div class="favicon-rest">
                <img src="./assets/site-images/favicon.png" id="favi" class="favi" onerror="this.src='./assets/site-images/favicon.png'">
            </div>
                <input class="search-bar" id="search-bar" placeholder="Search or type a URL" autocomplete="off">
        </div>

    </div>

    <div id="frames"></div>

    <script src="./scripts/bg.js"></script>
    <script src="./scripts/themeManager.js"></script>
    
    <script src="./scripts/main.js"></script>
</body>
</html>
