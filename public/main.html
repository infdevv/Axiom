<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom Browser</title>
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

</head>

<body>

    <div id="tabs">
        <span class="new-tab-btn" onclick="axiom.createTab()">
            <span class="material-symbols-outlined">add</span>
        </span>
    </div>

    <div id="controls">
        <div id="controls-buttons">
            <span class="material-symbols-outlined" onclick="axiom.nav('back')">arrow_back</span>
            <span class="material-symbols-outlined" onclick="axiom.nav('forward')">arrow_forward</span>
            <span class="material-symbols-outlined" onclick="axiom.nav('reload')">refresh</span>
        </div>

        <div id="search-section">
            <div class="favicon-rest">
                <img src="./assets/site-images/favicon.png" id="favi" class="favi" onerror="this.src='./assets/site-images/favicon.png'">
            </div>
                <input class="search-bar" id="search-bar" placeholder="Search or type a URL" autocomplete="off">
        </div>

    </div>

    <div id="frames"></div>

    <script src="./scripts/bg.js"></script>
    <script src="./scripts/themeManager.js"></script>
    
    <script>
        const axiom = {
            state: {
                tabs: {},
                activeTabId: null,
                tabCounter: 0,
                isTyping: false
            },

            processURL: function(url, tabId = '') {
                if (!url) return "";
                url = url.trim();
                if (url.startsWith("axiom://")) {
                    return url === "axiom://start" ? "./start.html" : "./" + url.split("://")[1] + ".html";
                }
                if (url.startsWith("http://") || url.startsWith("https://")) {
                    return `./render.html?url=${btoa(url)}&tabId=${tabId}`;
                }
                if (url.includes(".") && !url.includes(" ")) {
                     return `./render.html?url=${btoa("https://" + url)}&tabId=${tabId}`;
                }
                const searchBase = localStorage.getItem("axiomSearch") || "https://search.brave.com/search?q=";
                return `./render.html?url=${btoa(searchBase + encodeURIComponent(url))}&tabId=${tabId}`;
            },

            unprocessURL: function(rawUrl) {
                try {
                    console.log('Processing URL:', rawUrl);
                    
                    if (rawUrl.includes("render.html?url=")) {
                        return atob(rawUrl.split("?url=")[1]);
                    }
                    
                   let filename = '';
                    
                    if (rawUrl.includes('/')) {
                        filename = rawUrl.split('/').pop();
                    } else {
                        filename = rawUrl;
                    }
                    
                    console.log('Extracted filename:', filename);
                    
                    if (filename === 'start.html') {
                        console.log('Converting to axiom://start');
                        return 'axiom://start';
                    }
                    
                    if (filename.endsWith('.html')) {
                        const pageName = filename.replace('.html', '');
                        console.log('Converting to axiom://' + pageName);
                        return `axiom://${pageName}`;
                    }
                    
                    console.log('No conversion applied, returning original');
                    return rawUrl;
                } catch (e) { 
                    console.error('Error processing URL:', e);
                    return rawUrl; 
                }
            },

            createTab: function(url = "axiom://start") {
                this.state.tabCounter++;
                const tabId = "tab-" + this.state.tabCounter;

                const tabEl = document.createElement("div");
                tabEl.className = "tab";
                tabEl.id = tabId;
                tabEl.innerHTML = `
                    <span class="tab-name" id="${tabId}-title">New Tab</span>
                    <span class="x-button" onclick="event.stopPropagation(); axiom.closeTab('${tabId}')">✕</span>
                `;

                tabEl.addEventListener("mousedown", (e) => {
                    if (!e.target.classList.contains('x-button')) this.switchTab(tabId);
                });
                
                this.setupDragEvents(tabEl); 

                const tabsContainer = document.getElementById("tabs");
                const addBtn = document.querySelector(".new-tab-btn");
                tabsContainer.insertBefore(tabEl, addBtn);

                const frame = document.createElement("iframe");
                frame.id = tabId + "-frame";
                frame.style.display = "none";
                frame.src = this.processURL(url, tabId);
                
                frame.onload = () => {
                    this.updateBrowserState(tabId);
                    
                    setTimeout(() => {
                        const searchBar = document.getElementById("search-bar");
                        if (searchBar && this.state.tabs[tabId]) {
                            searchBar.value = this.state.tabs[tabId].url;
                            console.log('Forced search bar to show:', this.state.tabs[tabId].url);
                        }
                    }, 100);
                    
                    let detectedTitle = null;
                    
                    try {
                        const renderDoc = frame.contentDocument;
                        if (renderDoc && renderDoc.title && renderDoc.title !== 'Loading...') {
                            detectedTitle = renderDoc.title;
                            console.log(`Title from render.html: ${detectedTitle}`);
                        }
                    } catch(e) {
                        console.log(`Render.html access failed: ${e.message}`);
                    }
                    
                    if (!detectedTitle) {
                        const tabData = this.state.tabs[tabId];
                        if (tabData && tabData.url) {
                            try {
                                let url = tabData.url;
                                if (url.includes('render.html')) {
                                    const urlMatch = url.match(/url=([^&]+)/);
                                    if (urlMatch) {
                                        url = decodeURIComponent(atob(urlMatch[1]));
                                    }
                                }
                                
                                const domain = new URL(url).hostname;
                                if (domain) {
                                    detectedTitle = domain;
                                    console.log(`Using domain as title: ${detectedTitle}`);
                                }
                            } catch(e) {
                                console.log(`URL parsing failed: ${e.message}`);
                            }
                        }
                    }
                    
                    if (detectedTitle) {
                        this.updateTabTitle(tabId, detectedTitle);
                    } else {
                        console.log(`No title detected for ${tabId}`);
                    }
                };

                document.getElementById("frames").appendChild(frame);
                this.state.tabs[tabId] = { 
                    url: url,  
                    processedUrl: this.processURL(url, tabId),
                    title: "New Tab" 
                };
                this.switchTab(tabId);
                
                setTimeout(() => {
                    const searchBar = document.getElementById("search-bar");
                    if (searchBar) {
                        searchBar.value = url;
                        console.log('Immediately set search bar to:', url);
                    }
                }, 50);
            },

            closeTab: function(tabId) {
                if (document.getElementById(tabId)) document.getElementById(tabId).remove();
                if (document.getElementById(tabId + "-frame")) document.getElementById(tabId + "-frame").remove();
                
                delete this.state.tabs[tabId];

                if (this.state.activeTabId === tabId) {
                    const remainingIds = Object.keys(this.state.tabs);
                    if (remainingIds.length > 0) {
                        this.switchTab(remainingIds[remainingIds.length - 1]);
                    } else {
                        this.createTab();
                    }
                }
            },

            switchTab: function(tabId) {
                if (!this.state.tabs[tabId]) return;

                if (this.state.activeTabId) {
                    const oldFrame = document.getElementById(this.state.activeTabId + "-frame");
                    const oldTab = document.getElementById(this.state.activeTabId);
                    if (oldFrame) oldFrame.style.display = "none";
                    if (oldTab) oldTab.classList.remove("active");
                }

                this.state.activeTabId = tabId;
                const newFrame = document.getElementById(tabId + "-frame");
                const newTab = document.getElementById(tabId);
                
                if (newFrame) newFrame.style.display = "block";
                if (newTab) newTab.classList.add("active");

                this.updateBrowserState(tabId);
            },

            setupDragEvents: function(tab) {
                tab.addEventListener('mousedown', (e) => {
                    if (e.target.classList.contains('x-button')) return;
                    if (e.button !== 0) return; 

                    const state = {
                        tab: tab,
                        startX: e.clientX,
                        currentTranslate: 0,
                        tabWidth: tab.offsetWidth,
                        isDragging: false
                    };

                    const onMouseMove = (moveEvent) => {
                        const dx = moveEvent.clientX - state.startX;
                        
                        if (!state.isDragging && Math.abs(dx) > 5) {
                            state.isDragging = true;
                            tab.classList.add('dragging');
                            document.body.classList.add('is-dragging');
                        }

                        if (!state.isDragging) return;

                        const totalMove = dx + state.currentTranslate;
                        tab.style.transform = `translateX(${totalMove}px)`;

                        const currentVisualPosition = tab.offsetLeft + totalMove;
                        const center = currentVisualPosition + (state.tabWidth / 2);

                        const prevTab = tab.previousElementSibling;
                        if (prevTab && !prevTab.classList.contains('new-tab-btn')) {
                            const prevCenter = prevTab.offsetLeft + (prevTab.offsetWidth / 2);
                            if (center < prevCenter) this.swapTabs(tab, prevTab, state, moveEvent);
                        }

                        const nextTab = tab.nextElementSibling;
                        if (nextTab && !nextTab.classList.contains('new-tab-btn')) {
                            const nextCenter = nextTab.offsetLeft + (nextTab.offsetWidth / 2);
                            if (center > nextCenter) this.swapTabs(tab, nextTab, state, moveEvent);
                        }
                    };

                    const onMouseUp = () => {
                        window.removeEventListener('mousemove', onMouseMove);
                        window.removeEventListener('mouseup', onMouseUp);

                        if (state.isDragging) {
                            tab.classList.remove('dragging');
                            document.body.classList.remove('is-dragging');
                         
                            tab.style.transition = "transform 0.15s ease-out";
                            tab.style.transform = "translateX(0px)";
                            setTimeout(() => { tab.style.transition = ""; }, 150);
                        }
                    };

                    window.addEventListener('mousemove', onMouseMove);
                    window.addEventListener('mouseup', onMouseUp);
                });
            },

            swapTabs: function(draggingTab, targetTab, state, e) {
                const parent = draggingTab.parentNode;
                const oldOffset = draggingTab.offsetLeft;

                if (draggingTab.nextElementSibling === targetTab) {
                    parent.insertBefore(draggingTab, targetTab.nextElementSibling);
                } else {
                    parent.insertBefore(draggingTab, targetTab);
                }

                const newOffset = draggingTab.offsetLeft;
                const adjustment = oldOffset - newOffset;
                
                state.currentTranslate += adjustment;
                state.startX += adjustment; 
                
                const dx = e.clientX - state.startX;
                const totalMove = dx + state.currentTranslate;
                draggingTab.style.transform = `translateX(${totalMove}px)`;
            },

            updateBrowserState: function(tabId) {
                if(tabId !== this.state.activeTabId) return;
                const tabData = this.state.tabs[tabId];
                const searchBar = document.getElementById("search-bar");
                const favicon = document.getElementById("favi");

                if (!this.state.isTyping && document.activeElement !== searchBar && tabData) {
                    const displayUrl = tabData.url || "axiom://start";
                    searchBar.value = displayUrl;
                    console.log('Displaying stored URL:', displayUrl);
                }

                if (searchBar.value.startsWith("axiom://")) {
                    favicon.src = "./assets/site-images/logo.png";
                } else {
                    try {
                        const domain = new URL(searchBar.value).hostname;
                        favicon.src = `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
                    } catch(e) { favicon.src = "./assets/site-images/favicon.png"; }
                }
            },

            updateTabTitle: function(tabId, title) {
                if(!this.state.tabs[tabId]) return;
                
                const sanitizedTitle = title.replace(/[<>]/g, '').substring(0, 100) || "Browse";
                
                this.state.tabs[tabId].title = sanitizedTitle;
                const tabTitleEl = document.getElementById(tabId + "-title");
                if(tabTitleEl) {
                    tabTitleEl.textContent = sanitizedTitle;
                }
                
                if (tabId === this.state.activeTabId) {
                    document.title = `${sanitizedTitle} - Axiom Browser`;
                }
            },

            nav: function(action) {
                const iframe = document.getElementById(this.state.activeTabId + "-frame");
                if (!iframe || !iframe.contentWindow) return;
                try {
                    if (action === 'back') iframe.contentWindow.history.back();
                    if (action === 'forward') iframe.contentWindow.history.forward();
                    if (action === 'reload') iframe.contentWindow.location.reload();
                } catch(e) { if (action === 'reload') iframe.src = iframe.src; }
            },

            handleSearch: function(value) {
                const processed = this.processURL(value, this.state.activeTabId);
                const iframe = document.getElementById(this.state.activeTabId + "-frame");
                this.state.tabs[this.state.activeTabId].url = value;
                if (iframe) iframe.src = processed;
            },
            
        
        };

        const extractTitleFromUrl = (url) => {
            try {
                console.log('Extracting title from URL:', url);
                
                if (url.startsWith('http')) {
                    const parsedUrl = new URL(url);
                    const hostname = parsedUrl.hostname.replace('www.', '');
                    
                    const path = parsedUrl.pathname;
                    if (path !== '/' && path.length > 1) {
                        const pathTitle = path.split('/').pop();
                        if (pathTitle && !pathTitle.includes('.')) {
                            const result = hostname + ' - ' + decodeURIComponent(pathTitle);
                            console.log('Extracted title with path:', result);
                            return result;
                        }
                    }
                    
                    console.log('Extracted hostname as title:', hostname);
                    return hostname;
                }
                
                const filename = url.split('/').pop();
                const result = filename.replace(/\.[^/.]+$/, "") || 'Browse';
                console.log('Extracted filename as title:', result);
                return result;
                
            } catch (e) {
                console.log('URL parsing failed, using Browse:', e.message);
                return 'Browse';
            }
        };
        
        const monitorIframeTitles = () => {
            console.log('Checking titles for', Object.keys(axiom.state.tabs).length, 'tabs');
            
            Object.keys(axiom.state.tabs).forEach(tabId => {
                const frame = document.getElementById(tabId + '-frame');
                const tabData = axiom.state.tabs[tabId];
                
                if (frame && tabData) {
                    let newTitle = null;
                    
                    try {
                        const iframeDoc = frame.contentDocument;
                        if (iframeDoc && iframeDoc.title && 
                            iframeDoc.title !== 'Loading...' && 
                            iframeDoc.title !== 'Education') {
                            newTitle = iframeDoc.title;
                            console.log(`Found title in iframe for ${tabId}: ${newTitle}`);
                        }
                    } catch (e) {
                        newTitle = extractTitleFromUrl(tabData.url);
                        console.log(`Using URL fallback for ${tabId}: ${newTitle}`);
                    }
                    
                    if (newTitle && newTitle !== tabData.title) {
                        console.log(`Title change detected for ${tabId}: "${tabData.title}" -> "${newTitle}"`);
                        axiom.updateTabTitle(tabId, newTitle);
                    }
                }
            });
        };
    
        setInterval(monitorIframeTitles, 3000);
        
        setInterval(() => {
            const searchBar = document.getElementById("search-bar");
            if (searchBar && axiom.state.activeTabId && axiom.state.tabs[axiom.state.activeTabId]) {
                const currentUrl = searchBar.value;
                const tabUrl = axiom.state.tabs[axiom.state.activeTabId].url;
                
                if (currentUrl !== tabUrl && !axiom.state.isTyping) {
                    searchBar.value = tabUrl;
                    console.log('Updated search bar to show:', tabUrl);
                }
            }
        }, 500);
        


        document.addEventListener('DOMContentLoaded', () => {
     
            themeManager.load().then(() => {
                document.body.classList.add('main-page');
            }).catch(console.error);
            
            const searchBar = document.getElementById("search-bar");
            
            // Set initial search bar value
            if (searchBar) {
                searchBar.value = "axiom://start";
                console.log('Set initial search bar value to axiom://start');
            }
            
            searchBar.addEventListener("focus", () => { axiom.state.isTyping = true; searchBar.select(); });
            searchBar.addEventListener("blur", () => { axiom.state.isTyping = false; });
            searchBar.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    axiom.handleSearch(searchBar.value);
                    searchBar.blur();
                }
            });
            axiom.createTab();
        });
    </script>
</body>
</html>
