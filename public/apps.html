<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        /*
color pallet:
0D1B2A
1B263B
415A77
778DA9
E0E1DD
*/
@import url(https://fonts.googleapis.com/css?family=Inter:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic);


body {
    font-family: inter;
    background-color: transparent;
    overflow-x: hidden;
}

.app img {
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
}
* {
    color: var(--text-color);
}

.logo {
    margin-bottom: 0;
    padding-bottom: 0;
}

#time {
    margin-top: 0;
    padding-top: 0;
}

.division h3 {
    transition: all 0.3s ease;
}

.main_button{
    padding: 14px;
    border: none;
    box-shadow: 1px 1px 1px 1px rgba(7,7,7,0.2);
    border-radius: 4px;
    background-color: var(--theme-tertiary);
    cursor: pointer;
    transition: all 0.3s ease;
}

.main_button:hover {
    background-color: var(--theme-quaternary);
    transform: translateY(-2px);
    box-shadow: 2px 2px 2px 2px rgba(7,7,7,0.3);
}

.main_button_type2 {
    padding: 14px;
    border-style: solid;
    border-width: 3px;
    border-color: var(--theme-secondary);
    border-radius: 4px;
    background-color: transparent;
    cursor: pointer;
    transition: all 0.3s ease;
}

.main_button_type2:hover {
    background-color: var(--theme-tertiary);
    transform: translateY(-2px);
    box-shadow: 2px 2px 2px 2px rgba(7,7,7,0.3);
}

.logo {
    font-size: 60px;
    padding: 0px;
}

input {
    width:60%;
    background-color: rgba(var(--theme-tertiary-rgb), 0.6);
    padding: 14px;
    border: none;
    border-radius: 4px;
    transition: all 0.3s ease;
    animation: shrink 0.3s ease;
}

.division .apps  {
    display: flex;
    gap: 20px;
    justify-content: flex-start;
    margin-top: 20px;
    height: 170px;
    width: 100%;
    overflow-y: hidden;
    overflow-x: scroll;
    padding-left: 10px;
    padding-right: 10px;
}

.division .apps::-webkit-scrollbar {
    background-color: var(--theme-tertiary);
    color: var(--theme-secondary);
    height: 7px;
}
.division .apps::-webkit-scrollbar-thumb {
    background-color: var(--theme-secondary);
}

.division .apps img { /* how far will css let me stack these??? */
    min-height: 150px;
    max-height: 150px;
    min-width: 150px;
    max-width: 150px;
    border-radius: 15px;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;

    cursor: pointer;
}

.division .apps img:first-child {
    margin-left: 5px;
}

.division .apps img:hover{
    transform: scale(1.05);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
}

#search-res {
    text-align: left;
    margin-bottom: 20px;
}

#search-res h3 {
    margin-left: 10px;
}
    </style>
</head>
<body>
    <br>
    <br>
    <center>

        <input placeholder="Search for apps!">
        <div id="search-res" style="transition: all 0.3s ease;"></div>
        <div id="apps">
            <div class="division">
                <h3>Social Media</h3>
                <div class="division apps"  id="social">

                </div>
            </div>

            <div class="division">
                <h3>Movies/Media</h3>
                <div class="division apps" id="media">
 
                </div>
            </div>

            <div class="division">
                <h3>Misc</h3>
                <div class="division apps" id="misc">

                </div>
            </div>

        </div>

    </center>
    <script>
        let appsData = [];

        const searchInput = document.querySelector('input[placeholder="Search for apps!"]');
        const searchResults = document.getElementById('search-res');
        const appsContainer = document.getElementById('apps');

        searchInput.addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase().trim();
            if (searchTerm === '') {
                searchResults.innerHTML = '';
                appsContainer.style.display = 'block';
            } else {
                performSearch(searchTerm);
                appsContainer.style.display = 'none';
            }
        });

        function performSearch(searchTerm) {
            const filteredApps = appsData.filter(app =>
                app.app_name.toLowerCase().includes(searchTerm)
            );

            displaySearchResults(filteredApps);
        }

        function displaySearchResults(results) {
            if (results.length === 0) {
                searchResults.innerHTML = '<p>No apps found.</p>';
                return;
            }

            let resultsHTML = '<div class="division"><h3>Search Results</h3><div class="division apps" id="search-results-container">';
            
            results.forEach(app => {
                resultsHTML += `
                    <img src="${app.app_img}" alt="${app.app_name}" data-url="${app.app_url}" style="opacity: 1;">
                `;
            });

            resultsHTML += '</div></div>';
            searchResults.innerHTML = resultsHTML;

            const resultImages = searchResults.querySelectorAll('img');
            resultImages.forEach(img => {
                img.onclick = function() {
                    window.location = "./render.html?url=" + encodeURIComponent(btoa(this.dataset.url));
                };
            });
        }

        fetch("./assets/storage/apps.json").then(response => response.json()).then(data => {
            appsData = data;
            for (const app of data) {
                const image = document.createElement("img");
                image.src = app["app_img"];
                image.alt = app["app_name"];
                image.onload = function() {
                    this.style.opacity = "1";
                };
                image.onclick = function () {
                    window.location = "./render.html?url=" + encodeURIComponent(btoa(app["app_url"]));
                };

                document.getElementById(app["type"]).appendChild(image);
            }
        });
    </script>
    <script src="./scripts/themeManager.js"></script>
    <script>
        themeManager.load().then(() => {
            console.log('Theme loaded in apps.html');
        }).catch(console.error);
    </script>
</body>
